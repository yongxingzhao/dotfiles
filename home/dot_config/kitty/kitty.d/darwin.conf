# macOS 专属 Kitty 配置
# 由共享 kitty.conf 中的 globinclude kitty.d/*.conf 拉取。
# 仅当 hostname = YoXi-Mac 时由 chezmoi 部署（见 .chezmoiignore）。
#
# 这里只放 macOS 上生效的配置增量；通用配置在共享 kitty.conf 中。
# 参考架构：Arch 的 kitty.d/arch.conf（include hyde.conf + Linux 专属）。
# macOS 27.2 / Apple M1 Max / kitty 0.50 (Cask)

# ---- 字体：macOS 自带 Menlo / SF Mono ----
# Mac 上没有 Sarasa 系，用系统自带的 Menlo（最适合终端，自带标准连字）。
# 若想用等宽更细的 SF Mono，改 font_family 为 "SF Mono" 即可。
font_family          Menlo
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            13.0

# ---- 键盘：让 Option 作为 Alt 使用 ----
# macOS 的 ⌥ 默认输入特殊字符；终端里应作为 Alt (meta)。
macos_option_as_alt yes

# ---- 窗口/会话行为 ----
# 关闭最后一个窗口时不退出程序（保留后台进程），类似其他终端。
macos_quit_when_last_window_closed no
# 允许手动调整窗口大小
macos_window_resizable    yes
# 标题栏显示当前目录，便于多标签区分
macos_show_window_title_in window

# ---- 触控板/滚动 ----
# MacBook 触控板惯性滚动，单格更顺滑；wheel_scroll_multiplier 调整鼠标滚轮行数。
wheel_scroll_multiplier     3.0
touch_scroll_multiplier     3.0

# ---- 选中即复制（与 arch.conf 保持一致的习惯）----
copy_on_select clipboard

# ---- 光标 ----
cursor_shape                  block
cursor_blink_interval         0.7
cursor_stop_blinking_after    5.0

# ---- 链接 ----
# 悬停高亮 URL，打开默认浏览器
url_color             #5aa0ff
url_style             curly

# ---- 提示：当前无其他 Mac 专属差异 ----
# 如需：macos_hide_from_running_apps、背景透明(background_opacity)、
# 随系统深色/浅色主题切换(theme) 等，可在此追加。
