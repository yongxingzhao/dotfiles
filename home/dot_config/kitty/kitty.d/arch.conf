include ../hyde.conf

font_size 9
# ---- 覆盖 HyDE 的窗口内边距 (added 2026-11-03) ----
# hyde.conf 默认 window_padding_width 25，prompt 离窗口边缘太远；
# 放在 include 之后，优先级更高，且不会被 HyDE 重新生成 hyde.conf 覆盖。
window_padding_width 5

# ---- 平铺窗口管理器下不要记忆窗口大小/状态 (added 2026-11-01) ----
# 默认 remember_window_size yes 会把上次的 "maximized" 状态记进
# ~/.cache/kitty/main.json，导致每次新开 kitty 都请求 set_maximized，
# 在 Hyprland 里表现为"覆盖整屏"而不是分屏平铺。
remember_window_size no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no

# ---- flatpak NBSP(U+00A0) shows as ? fix ----
# glib g_format_size_full inserts NBSP(U+00A0) between number and unit;
# kitty renders it as ? with current font; map to Sarasa Fixed SC.
symbol_map U+00A0 Sarasa Fixed SC
